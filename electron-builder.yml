appId: com.majinfanhua.hangkeide
# productName 用 ASCII，避开 Win7 上非 ASCII 路径可能引发的异常。
# 注意：真正决定 %APPDATA% 下用户数据目录名的是 package.json 的 name
# （Electron 的 app.getName() 默认取它），不是这里的 productName。
# 两者现在都是 hangkeIDE，并在 src/main/index.ts 里用 app.setPath('userData')
# 显式固定，避免文档、CI 日志路径与实际目录对不上。
productName: hangkeIDE
copyright: Copyright © 2026 majinfanhua

directories:
  output: release
  buildResources: build

# 所有依赖都在 devDependencies 里（主进程/渲染进程都经过打包），
# 因此不需要把 node_modules 塞进 asar
files:
  - out/**/*
  - package.json

# 解压后摆在 exe 旁边，方便老师直接看
extraFiles:
  - from: resources/使用说明.txt
    to: 使用说明.txt

# zip 打完之后套一层顶层文件夹。
#
# electron-builder 的 zip 目标是**平铺**的（Windows 上写死 withoutDir=true），
# 解压出来是 hangkeIDE.exe + locales/ + resources/ + 一堆 dll 散在下载目录里。
# 这里挂一个钩子把顶层条目整体挪进 `hangkeIDE-<version>-win7-win10-<arch>/`，
# 学生解压得到的是一个文件夹，整个拖到 D:\ 下就能用。
#
# 为什么不在配置里解决：24.x 的 zip 目标没有「包一层目录」的选项，
# artifactName 只管归档文件名，改不了归档内的路径。详见脚本头注释。
afterAllArtifactBuild: scripts/zip-wrap-folder.mjs

asar: true

# 零原生依赖，跳过 node-gyp 重建
npmRebuild: false

win:
  # 应用图标（exe 图标 + 任务栏）。由 scripts/make-icon.py 生成，
  # 里面含 16/24/32/48/64/128/256 七个尺寸，小图标不会糊。
  icon: build/icon.ico
  # 只出免安装 zip，不做 NSIS 安装器
  target:
    - target: zip
      arch:
        - x64
        - ia32
  # 产物名带上系统范围，方便分发时判断该给谁
  artifactName: hangkeIDE-${version}-win7-win10-${arch}.${ext}
  # 不签名：Win7 验签需要 KB4474419，免安装包也用不上。
  # 注意：electron-builder 24.x 的 win 配置里没有 signtoolOptions（25+ 才引入），
  # 且该对象 additionalProperties=false，写了会直接因 schema 校验失败中断打包。
  # 真正的“不签名”由 CI 里的 CSC_IDENTITY_AUTO_DISCOVERY=false 保证。
  forceCodeSigning: false

# 不使用 electron-builder 的自动更新通道
publish: null
