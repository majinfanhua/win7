name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows-portable:
    name: 打包免安装版
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      # 不签名，也不去自动探测证书
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建（含 chrome108 / node16 目标护栏）
        run: npm run build

      - name: 打包 x64 + ia32
        run: npm run dist:win

      - name: 启动自检（软件渲染，主门禁）
        shell: pwsh
        run: |
          $dir = 'release/win-unpacked'
          if (-not (Test-Path $dir)) { throw "未找到解包目录 $dir，打包可能未产出预期结构" }
          $exe = Join-Path $dir 'AIEditor.exe'
          if (-not (Test-Path $exe)) { throw "未找到可执行文件 $exe" }
          Write-Host "自检目标: $exe"
          # --software：runner 上没有真实 GPU，强制软件渲染让结果可复现
          & $exe --self-test --software --self-test-out=selftest.json
          $code = $LASTEXITCODE
          if (Test-Path selftest.json) { Get-Content selftest.json -Raw }
          if ($code -ne 0) { throw "启动自检失败，退出码 $code" }

      - name: 启动自检（默认图形路径，仅记录不阻断）
        # 只用于观察默认路径在无 GPU 环境下的表现，不作为发布门禁
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = 'release/win-unpacked/AIEditor.exe'
          if (-not (Test-Path $exe)) { throw "未找到可执行文件 $exe" }
          & $exe --self-test --self-test-out=selftest-default-gpu.json
          $code = $LASTEXITCODE
          if (Test-Path selftest-default-gpu.json) { Get-Content selftest-default-gpu.json -Raw }
          if ($code -ne 0) { Write-Warning "默认图形路径自检未通过（退出码 $code），仅记录" }

      - name: 失败时导出日志
        if: failure()
        shell: pwsh
        run: |
          $logDir = Join-Path $env:APPDATA 'AIEditor\logs'
          if (Test-Path $logDir) {
            Get-ChildItem $logDir | ForEach-Object { Write-Host "===== $($_.Name) ====="; Get-Content $_.FullName -Raw }
          } else { Write-Host '未生成日志目录' }

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AIEditor-win7-win10-portable
          if-no-files-found: error
          path: |
            release/*.zip
            selftest*.json
