name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 发布 Release 需要写权限；不显式声明的话默认 GITHUB_TOKEN 只有读权限
permissions:
  contents: write

jobs:
  windows-portable:
    name: 打包免安装版
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      # 不签名，也不去自动探测证书
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      # 护栏拆成独立步骤，不串在 npm run build 里。
      # 原因：GitHub 的运行数据（无需 token 即可读）只暴露到「步骤」这一层，
      # 合成一步的话失败了只能看到「构建失败」，分不清是哪个护栏。
      # 同时把失败输出用 ::error 注解发出去 —— 注解同样是公开可读的，
      # 这样定位原因不必去翻需要权限的日志（job logs 接口要 admin 权限）。
      - name: 护栏 - Node 16 API 边界
        shell: pwsh
        run: |
          $out = & npm run check:node16 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $tail = (($out -split "`r?`n") | Where-Object { $_ -ne '' } | Select-Object -Last 25) -join '%0A'
            $tail = $tail -replace '%', '%25' -replace "`r", '%0D'
            Write-Host "::error title=check:node16 失败::$tail"
            exit 1
          }

      - name: 护栏 - 文件监视时序
        shell: pwsh
        run: |
          $out = & npm run check:watch 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $tail = (($out -split "`r?`n") | Where-Object { $_ -ne '' } | Select-Object -Last 30) -join '%0A'
            $tail = $tail -replace '%', '%25' -replace "`r", '%0D'
            Write-Host "::error title=check:watch 失败::$tail"
            exit 1
          }

      - name: 护栏 - CSS Chromium 108 边界
        # build.target=chrome108 只约束 JS（交给 esbuild 降级），CSS 不在那条链路上：
        # esbuild 对 color-mix()/@container 这类特性不做目标校验，原样输出。
        # 后果是「浏览器预览正常、Win7 上样式静默失效」，所以单独扫一遍 CSS。
        shell: pwsh
        run: |
          $out = & npm run check:css108 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $tail = (($out -split "`r?`n") | Where-Object { $_ -ne '' } | Select-Object -Last 25) -join '%0A'
            $tail = $tail -replace '%', '%25' -replace "`r", '%0D'
            Write-Host "::error title=check:css108 失败::$tail"
            exit 1
          }

      - name: 护栏 - 平台契约
        # 契约是发给模型的行为约定，失效方式是静默的（少一段、混入时间戳、
        # 被用户文本伪造）。所以单独扫一遍，失败原因走 ::error 注解。
        shell: pwsh
        run: |
          $out = & npm run check:contract 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $tail = (($out -split "`r?`n") | Where-Object { $_ -ne '' } | Select-Object -Last 25) -join '%0A'
            $tail = $tail -replace '%', '%25' -replace "`r", '%0D'
            Write-Host "::error title=check:contract 失败::$tail"
            exit 1
          }

      - name: 构建（electron-vite）
        shell: pwsh
        run: |
          $out = & npx electron-vite build 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) {
            $tail = (($out -split "`r?`n") | Where-Object { $_ -ne '' } | Select-Object -Last 30) -join '%0A'
            $tail = $tail -replace '%', '%25' -replace "`r", '%0D'
            Write-Host "::error title=electron-vite build 失败::$tail"
            exit 1
          }

      - name: 打包 x64 + ia32
        run: npm run dist:win

      - name: 启动自检（软件渲染，主门禁）
        shell: pwsh
        run: |
          $dir = 'release/win-unpacked'
          if (-not (Test-Path $dir)) { throw "未找到解包目录 $dir，打包可能未产出预期结构" }
          $exe = Join-Path $dir 'hangkeIDE.exe'
          if (-not (Test-Path $exe)) { throw "未找到可执行文件 $exe" }
          Write-Host "自检目标: $exe"

          # 关键：hangkeIDE.exe 是 GUI 子系统程序，PowerShell 用 & 调用它不会等待，
          # 且 $LASTEXITCODE 不会被赋值 —— 之前因此把「自检其实已经通过」
          # 误报成了「退出码为空」。必须用 Start-Process -Wait -PassThru 取退出码。
          # --software：runner 上没有真实 GPU，强制软件渲染让结果可复现
          $argList = @('--self-test', '--software', '--self-test-out=selftest.json')
          $proc = Start-Process -FilePath $exe -ArgumentList $argList -WorkingDirectory (Get-Location).Path -NoNewWindow -Wait -PassThru
          $code = $proc.ExitCode

          # 以报告内容为准，退出码作为辅助证据（两者应当一致）
          $ok = $false
          $report = $null
          if (Test-Path selftest.json) {
            Get-Content selftest.json -Raw -Encoding UTF8
            $report = Get-Content selftest.json -Raw -Encoding UTF8 | ConvertFrom-Json
            $ok = ($report.ok -eq $true)
          } else {
            Write-Warning '未生成 selftest.json，自检未走完'
          }
          Write-Host "自检退出码=$($code) 报告 ok=$ok"
          if (-not $ok -or $code -ne 0) {
            # job 日志要仓库 admin 权限才能下载，注解不用 ——
            # 把「哪几项检查是 false」直接发成注解，否则失败后只能靠猜。
            $lines = @()
            if ($report) {
              # failedGates 是应用自己算出来的「哪几道门没过」，比在 PowerShell
              # 里猜「值为 false 的项」准 —— devApiStub / capabilityOverridden
              # 这类「false 才是正常」的项不会被误报。
              $failed = @($report.checks.failedGates)
              if ($failed.Count -gt 0) {
                $lines += "失败的门($($failed.Count)): $($failed -join ', ')"
              } else {
                $lines += 'failedGates 为空 —— 可能卡在更早的地方'
              }
              $lines += '三个入口的实测几何:'
              $lines += "  quickStartCount=$($report.checks.quickStartCount) rows=$($report.checks.quickStartRows)"
              foreach ($r in @($report.checks.quickStartRects)) {
                $lines += "  rect top=$($r.top) left=$($r.left) w=$($r.w)"
              }
              $lines += '能力相关字段:'
              $lines += "  profile=$($report.checks.capabilityProfile)"
              $lines += "  mode=$($report.checks.capabilityMode) overridden=$($report.checks.capabilityOverridden)"
              $lines += "  detected=$(($report.checks.capabilityDetected | ConvertTo-Json -Compress))"
              $lines += "  effective($($report.checks.capabilityEffectiveCount))=$(($report.checks.capabilityEffective) -join ',')"
              $lines += "  filtered=$(($report.checks.capabilityFiltered) -join ' ; ')"
              $lines += "  osTier=$($report.checks.osTier) softwareRendering=$($report.checks.softwareRendering)"
              $lines += "  ipc=$($report.checks.ipc) ipcError=$($report.checks.ipcError)"
              $lines += "  domNodes=$($report.checks.domNodes) title=$($report.checks.title)"
              $lines += "  runtime=$(($report.runtime | ConvertTo-Json -Compress -Depth 2))"
            } else {
              $lines += '未生成 selftest.json —— 应用可能启动就退了，看下面导出的日志'
            }
            $detail = ($lines -join '%0A') -replace '%', '%25' -replace "`r", ''
            Write-Host "::error title=启动自检失败(退出码=$code)::$detail"
            throw "启动自检失败：退出码=$($code) 报告ok=$ok"
          }

      - name: 启动自检（Win7 能力档，验证降级分支）
        # CI runner 是 Server 2022，探测结果永远是 win10 ——
        # 「Win7 上少一批工具」那条分支在这里永远跑不到，坏了也不知道。
        # 用 --capability-profile=win7 强制走一遍，并与默认档对比。
        # 断言写成「子集关系」而不是「数量不同」：以后再加工具也不会让这里失效。
        shell: pwsh
        run: |
          $exe = 'release/win-unpacked/hangkeIDE.exe'
          if (-not (Test-Path $exe)) { throw "未找到可执行文件 $exe" }
          if (-not (Test-Path 'selftest.json')) { throw '缺少默认档的 selftest.json，上一步可能未产出' }

          $argList = @('--self-test', '--software', '--capability-profile=win7', '--self-test-out=selftest-win7.json')
          $proc = Start-Process -FilePath $exe -ArgumentList $argList -WorkingDirectory (Get-Location).Path -NoNewWindow -Wait -PassThru
          $code = $proc.ExitCode
          if (-not (Test-Path 'selftest-win7.json')) { throw '未生成 selftest-win7.json，Win7 档自检未走完' }

          $a = Get-Content 'selftest.json'      -Raw -Encoding UTF8 | ConvertFrom-Json
          $b = Get-Content 'selftest-win7.json' -Raw -Encoding UTF8 | ConvertFrom-Json

          Write-Host "默认档：$($a.checks.capabilityProfile) | 生效 $($a.checks.capabilityEffectiveCount) 个 [$($a.checks.capabilityEffective -join ', ')]"
          Write-Host "Win7 档：$($b.checks.capabilityProfile) | 生效 $($b.checks.capabilityEffectiveCount) 个 [$($b.checks.capabilityEffective -join ', ')]"
          Write-Host "Win7 档未启用：$($b.checks.capabilityFiltered -join '；')"

          if ($code -ne 0) { throw "Win7 档自检退出码 $($code)" }
          if (-not $b.ok) { throw "Win7 档自检未通过：$($b.checks | ConvertTo-Json -Compress)" }

          # 1) 覆盖开关确实生效
          if ($b.checks.capabilityOverridden -ne $true) { throw '--capability-profile=win7 未生效（overridden 应为 true）' }
          if ($b.checks.capabilityProfile -notlike '*win7*') { throw "Win7 档的 profile 字符串异常：$($b.checks.capabilityProfile)" }

          # 2) 命令执行能力现在**只看探测结果，不按系统等级一刀切**。
          #
          # 这里曾经断言「Win7 档不应启用命令执行」，理由是「Win7 裸机只有 cmd.exe」——
          # 那个理由站不住：cmd.exe 在所有 Windows 上都有，Win7 完全能跑 python / node。
          # 旧逻辑根本没查解释器在不在，直接把 Win7 的 4 个工具砍掉了。
          #
          # 现在 Win7 / Win10 走同一条路径：探测到 cmd.exe 就启用。
          # 所以断言改成「两档的能力必须一致」——如果哪天又有人给 Win7 加回
          # 特殊分支，这条会立刻红。
          if ($a.checks.capabilityDetected.commandExec -ne $b.checks.capabilityDetected.commandExec) {
            throw "Win7 档与默认档的命令能力不一致：win7=$($b.checks.capabilityDetected.commandExec) default=$($a.checks.capabilityDetected.commandExec)"
          }
          if ($a.checks.capabilityDetected.commandExec -ne $true) {
            throw 'runner 上未探测到命令执行能力 —— cmd.exe 应当总是存在，探测逻辑可能坏了'
          }

          # 2b) 两档的工具集必须完全相同（命令类工具不再按系统区分）
          $onlyB = @($b.checks.capabilityEffective | Where-Object { $a.checks.capabilityEffective -notcontains $_ })
          $onlyA = @($a.checks.capabilityEffective | Where-Object { $b.checks.capabilityEffective -notcontains $_ })
          if ($onlyB.Count -gt 0) { throw "Win7 档多出了默认档没有的工具：$($onlyB -join ', ')" }
          if ($onlyA.Count -gt 0) { throw "Win7 档缺少了默认档有的工具：$($onlyA -join ', ')" }

          foreach ($t in @('runCommand', 'jobRun', 'jobPoll', 'jobKill')) {
            if ($b.checks.capabilityEffective -notcontains $t) {
              throw "Win7 档应当启用命令类工具 $t（cmd.exe 存在就该启用）"
            }
          }

          Write-Host '✓ Win7 与默认档能力一致，命令类工具在 Win7 上也启用'

      - name: 启动自检（默认图形路径，仅记录不阻断）
        # 只用于观察默认路径在无 GPU 环境下的表现，不作为发布门禁
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = 'release/win-unpacked/hangkeIDE.exe'
          if (-not (Test-Path $exe)) { throw "未找到可执行文件 $exe" }
          $argList = @('--self-test', '--self-test-out=selftest-default-gpu.json')
          $proc = Start-Process -FilePath $exe -ArgumentList $argList -WorkingDirectory (Get-Location).Path -NoNewWindow -Wait -PassThru
          $code = $proc.ExitCode
          if (Test-Path selftest-default-gpu.json) { Get-Content selftest-default-gpu.json -Raw -Encoding UTF8 }
          if ($code -ne 0) { Write-Warning "默认图形路径自检未通过（退出码 $($code)），仅记录" }

      - name: 失败时导出日志
        if: failure()
        shell: pwsh
        run: |
          # 目录名由 src/main/index.ts 的 app.setPath('userData') 固定为 hangkeIDE
          $logDir = Join-Path $env:APPDATA 'hangkeIDE\logs'
          if (Test-Path $logDir) {
            Get-ChildItem $logDir | ForEach-Object { Write-Host "===== $($_.Name) ====="; Get-Content $_.FullName -Raw }
          } else { Write-Host "未生成日志目录 $($logDir)" }

      - name: 产物清单（日志即证据）
        shell: pwsh
        run: |
          # 把打包结果写进日志：即使 Artifacts 面板没找到，日志里也能确认产物到底有没有生成
          $files = Get-ChildItem release -File | Sort-Object Name
          if (-not $files) { throw 'release 目录下没有任何文件，打包未产出产物' }
          $files | Select-Object Name, @{ n = 'SizeMB'; e = { [math]::Round($_.Length / 1MB, 2) } } | Format-Table -AutoSize | Out-String | Write-Host
          Get-ChildItem release -Filter *.zip | ForEach-Object {
            Write-Host "SHA256 $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)"
          }
          $zipCount = (Get-ChildItem release -Filter *.zip).Count
          Write-Host "共 $($zipCount) 个 zip 产物"
          if ($zipCount -lt 2) { throw "预期 2 个 zip（x64 / ia32），实际 $($zipCount) 个" }

      - name: 上传产物（Artifacts）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hangkeIDE-win7-win10-portable
          if-no-files-found: error
          path: |
            release/*.zip
            selftest*.json

      # 以下两步让产物出现在 Releases 页，比 Artifacts 面板好找，链接也能长期分享
      - name: 发布滚动 Release（main 每次推送）
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Actions 的 pwsh 默认 $ErrorActionPreference='Stop'，
          # 删一个不存在的 release 会往 stderr 写字，可能直接中断步骤，所以显式放宽。
          $ErrorActionPreference = 'Continue'
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest release/*.zip --title "最新构建（main，非正式）" --prerelease --notes "自动构建，随 main 分支滚动更新，非正式版本。x64 包用于 64 位系统，ia32 包用于 32 位系统。支持 Windows 7 SP1 ~ Windows 10。"
          # gh 是控制台程序，$LASTEXITCODE 可用（和 GUI 子系统程序不同）
          if ($LASTEXITCODE -ne 0) { throw "发布滚动 Release 失败，退出码 $($LASTEXITCODE)" }
          Write-Host "已发布: $($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/releases/tag/latest"

      - name: 发布正式 Release（推送 v* tag）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          gh release create "${{ github.ref_name }}" release/*.zip --title "AI 教学编辑器 ${{ github.ref_name }}" --notes "免安装版 zip：x64 包用于 64 位系统，ia32 包用于 32 位系统。支持 Windows 7 SP1 ~ Windows 10，不支持 Windows 11。解压到纯英文无空格目录后双击 hangkeIDE.exe，详见包内使用说明。"
          if ($LASTEXITCODE -ne 0) { throw "发布正式 Release 失败，退出码 $($LASTEXITCODE)" }
